[project]
name = "graphids"
version = "0.1.0"
description = "Self-supervised GNN for Network Intrusion Detection"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.4.0",
    "torch-geometric==2.6.1",
    "torchaudio==2.4.0",
    "torchvision==0.19.0",
    "torch-scatter",
    "torch-sparse",
    "scikit-learn>=1.6.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "pytest>=8.0.0",
    "wandb>=0.16.0",
    "pyyaml>=6.0",
    "matplotlib>=3.10.9",
    "tqdm>=4.67.0",
]

[tool.uv.sources]
torch-scatter = { index = "pyg" }
torch-sparse = { index = "pyg" }

[[tool.uv.index]]
name = "pyg"
url = "https://data.pyg.org/whl/torch-2.4.0+cpu.html"
format = "flat"

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0.0",
    "ruff>=0.14.0",
    "ty",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
# Enable specific rule categories
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]

ignore = [
    "E501",   # Line too long (handled by formatter)
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-third-party = ["wandb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore:`torch_geometric\\.distributed` has been deprecated since 2\\.7\\.0:DeprecationWarning",
    "ignore:Failing to pass a value to the 'type_params' parameter of 'typing\\._eval_type' is deprecated:DeprecationWarning",
    "ignore:The PyTorch API of nested tensors is in prototype stage:UserWarning",
]
